events {
    worker_connections 1024;
}

http {
    # Usa o DNS interno do Docker para re-resolver upstreams em runtime
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─── Upstream do Chat Service (round-robin) ───────────────────────────────
    upstream upstream_chat {
        server chat-service-1:8000;
        server chat-service-2:8000;
    }

    server {
        listen 80;

        # ─── Auth Service ─────────────────────────────────────────────────────
        # rewrite + variável: strip do prefix e re-resolução DNS dinâmica
        location /api/auth/ {
            set $auth_upstream auth-service;
            rewrite ^/api/auth/(.*) /$1 break;
            proxy_pass         http://$auth_upstream:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── Chat Service (REST) ──────────────────────────────────────────────
        location /api/chat/ {
            proxy_pass         http://upstream_chat/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── WebSocket ────────────────────────────────────────────────────────
        location /ws {
            proxy_pass             http://upstream_chat/ws;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ─── Frontend ─────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend:5173;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            # Necessário para hot-reload do Vite (Server-Sent Events)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
